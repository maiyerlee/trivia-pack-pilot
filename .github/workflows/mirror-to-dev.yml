# Forward mirror: production repo `dev` branch  -->  dev repo `main`.
#
# Runs only in the production repo (see the `if:` on the job). The same file
# lives in the dev repo because the mirror copies .github/ too; it is a no-op there.
#
# Two files are environment-specific and are never copied:
#   .env                   (Supabase URL / project id / publishable key)
#   supabase/config.toml   (Supabase project id)
# Copying them would point the dev Lovable project at the production backend.
#
# Loop protection: commits made by either sync workflow carry "[mirror]" in the
# message. Each workflow skips when the triggering commit carries that marker,
# and additionally exits early when the copy produces no diff.

name: Mirror dev to dev repo

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: mirror-dev
  cancel-in-progress: false

env:
  SOURCE_REPO: maiyerlee/trivia-pack-pilot
  SOURCE_BRANCH: dev
  DEST_REPO: maiyerlee/trivia-launchpad-dev
  DEST_BRANCH: main

jobs:
  mirror:
    if: >-
      github.repository == 'maiyerlee/trivia-pack-pilot' &&
      !contains(github.event.head_commit.message, '[mirror]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source (this repo, dev branch)
        uses: actions/checkout@v4
        with:
          path: src

      - name: Check out destination (dev repo)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEST_REPO }}
          ref: ${{ env.DEST_BRANCH }}
          token: ${{ secrets.MIRROR_TOKEN }}
          path: dest

      - name: Copy everything except environment-specific files
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='supabase/config.toml' \
            src/ dest/

      - name: Safety check - protected files untouched
        working-directory: dest
        run: |
          set -euo pipefail
          if ! git diff --quiet -- .env supabase/config.toml; then
            echo "::error::Protected environment files would change. Refusing to push."
            git diff -- .env supabase/config.toml
            exit 1
          fi

      - name: Commit and push if anything changed
        working-directory: dest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to mirror."
            exit 0
          fi
          SHORT="${GITHUB_SHA::7}"
          git commit \
            -m "Mirror from ${SOURCE_REPO}@${SOURCE_BRANCH} (${SHORT}) [mirror]" \
            -m "Source: https://github.com/${SOURCE_REPO}/commit/${GITHUB_SHA}"
          git push origin "HEAD:${DEST_BRANCH}"
